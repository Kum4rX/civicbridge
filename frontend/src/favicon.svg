<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="civix-brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F4ED8"/>
      <stop offset="100%" stop-color="#0F9D8F"/>
    </linearGradient>
  </defs>
  <!-- Civix Signature Squircle Base -->
  <rect width="64" height="64" rx="14" fill="url(#civix-brand-grad)"/>
  
  <!-- Civic Governance Portico (Capitol / Democracy Institution) -->
  <!-- Classical Triangular Pediment -->
  <polygon points="32,11.875 13.125,23.75 50.875,23.75" fill="#FFFFFF"/>
  
  <!-- Entablature / Structural Beam -->
  <rect x="11.875" y="24.375" width="40.25" height="3.75" rx="1.25" fill="#FFFFFF"/>
  
  <!-- 3 Civic Columns (Citizens, Democracy, Accountability) -->
  <rect x="15.3125" y="29.375" width="6.5625" height="15" rx="1.5625" fill="#FFFFFF"/>
  <rect x="28.71875" y="29.375" width="6.5625" height="15" rx="1.5625" fill="#FFFFFF"/>
  <rect x="42.125" y="29.375" width="6.5625" height="15" rx="1.5625" fill="#FFFFFF"/>
  
  <!-- 2-Tier Civic Foundation Steps -->
  <rect x="11.875" y="45.3125" width="40.25" height="3.4375" rx="1.25" fill="#FFFFFF"/>
  <rect x="9.375" y="49.375" width="45.25" height="3.4375" rx="1.4" fill="#FFFFFF"/>
</svg>
